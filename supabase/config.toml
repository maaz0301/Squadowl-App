
# Stripe calls this server-to-server with only a Stripe-Signature header (no Supabase JWT).
# It verifies the Stripe signature itself, so JWT verification must be disabled or the
# gateway rejects Stripe's webhook with 401 and the account plan never updates.
[functions.stripe-webhook]
enabled = true
verify_jwt = false
entrypoint = "./functions/stripe-webhook/index.ts"

# Stripe calls this server-to-server too, on a separate Connect-only webhook
# secret (STRIPE_CONNECT_WEBHOOK_SECRET) so platform and connected-account
# events can't be replayed against each other.
[functions.stripe-connect-webhook]
enabled = true
verify_jwt = false
entrypoint = "./functions/stripe-connect-webhook/index.ts"

# Guardians pay registration fees from the public registration page before
# ever creating an account, so this can't require a Supabase JWT.
[functions.create-registration-payment]
enabled = true
verify_jwt = false
entrypoint = "./functions/create-registration-payment/index.ts"

[functions.send-email]
enabled = true
verify_jwt = false
import_map = "./functions/send-email/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/send-email/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/send-email/*.html" ]

[functions.resend-invite]
enabled = true
verify_jwt = false
import_map = "./functions/resend-invite/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/resend-invite/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/resend-invite/*.html" ]
